name: Build and Release PharmacyPOS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # needed to attach the installer to a GitHub Release on tag pushes

jobs:
  build-windows:
    # Build natively on Windows: the installer's .exe icon/metadata is edited
    # with the real toolchain (no wine) and the result is what users run.
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install root and frontend dependencies
        run: |
          npm ci
          npm ci --prefix frontend

      # Builds the frontend, stages a production-only backend, then runs
      # electron-builder --win nsis --x64  (see package.json "build:win").
      - name: Build Windows installer
        run: npm run build:win

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: PharmacyPOS-Windows-Installer
          path: release/*.exe
          if-no-files-found: error

      - name: Attach installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
