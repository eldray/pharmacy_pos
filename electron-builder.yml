appId: com.pharmacypos.app
productName: PharmacyPOS

directories:
  output: release
  buildResources: build

# Files bundled into the asar
files:
  - main.cjs
  - preload.js
  - package.json

# Bundled alongside the asar (not compressed — needed at runtime)
extraResources:
  - from: backend
    to: backend
    filter:
      - "**/*"
      - "!*.log"
      - "!*.db"           # No SQLite db needed anymore
      - "!*.db-shm"
      - "!*.db-wal"
  - from: frontend/dist
    to: frontend/dist

asar: true
asarUnpack:
  - backend/node_modules/**/*   # native addons must be outside asar
  - frontend/dist/**/*

# PostgreSQL has no native addon to rebuild — safe to enable
npmRebuild: false
npmSkipBuildFromSource: false

# ─── Windows ──────────────────────────────────────────────────────────────────
win:
  target:
    - nsis
    - portable
  icon: build/icon.ico
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  shortcutName: PharmacyPOS

# ─── Linux ────────────────────────────────────────────────────────────────────
linux:
  target:
    - deb
    - AppImage
  category: Utility
  icon: build/icons
  maintainer: Emmanuel Appiah <emk.appiah@gmail.com>
  artifactName: ${productName}-${version}-${arch}.${ext}
  desktop:
    Name: PharmacyPOS
    Comment: Pharmacy Point of Sale System
    Categories: Office;Business;Utility
    StartupNotify: true
    Terminal: false
    Type: Application

deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libcups2
  compression: xz
  priority: optional

# ─── Mac ──────────────────────────────────────────────────────────────────────
mac:
  target:
    - dmg
    - zip
  category: public.app-category.business
  icon: build/icon.icns

publish: null