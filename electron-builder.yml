appId: com.pharmacypos.app
productName: PharmacyPOS

directories:
  output: release
  # NOTE: "build/" is gitignored, so icons live in a tracked folder instead.
  buildResources: build-resources

# Packed into app.asar: just the Electron shell.
files:
  - main.cjs
  - preload.js
  - package.json
  - build-resources/icon.ico

# Shipped next to the asar under <install dir>/resources/.
# The backend comes from build-staging/ (created by `npm run prepare:backend`):
# production-only node_modules, no .env, no uploads, no logs/backups.
extraResources:
  - from: build-staging/backend
    to: backend
  - from: frontend/dist
    to: frontend/dist

asar: true

# Backend deps (pg, sequelize, bcryptjs, ...) are pure JavaScript, so nothing
# needs rebuilding against Electron's ABI.
npmRebuild: false

# ─── Windows ──────────────────────────────────────────────────────────────────
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build-resources/icon.ico

nsis:
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}
  oneClick: false
  perMachine: false            # per-user install, no admin rights needed
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: PharmacyPOS
  installerIcon: build-resources/icon.ico
  uninstallerIcon: build-resources/icon.ico
  installerHeaderIcon: build-resources/icon.ico
  deleteAppDataOnUninstall: false   # keep the user's DB settings on uninstall

portable:
  artifactName: ${productName}-Portable-${version}-${arch}.${ext}

# ─── Linux ────────────────────────────────────────────────────────────────────
linux:
  target:
    - deb
    - AppImage
  category: Utility
  maintainer: Emmanuel Appiah <emk.appiah@gmail.com>
  artifactName: ${productName}-${version}-${arch}.${ext}
  desktop:
    Name: PharmacyPOS
    Comment: Pharmacy Point of Sale System
    Categories: Office;Business;Utility
    StartupNotify: true
    Terminal: false
    Type: Application

deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libcups2
  compression: xz
  priority: optional

# ─── Mac ──────────────────────────────────────────────────────────────────────
mac:
  target:
    - dmg
    - zip
  category: public.app-category.business

publish: null
