appId: com.pharmacypos.app
productName: PharmacyPOS

directories:
  output: release
  buildResources: build

files:
  - main.cjs
  - preload.js
  - package.json

extraResources:
  - from: backend
    to: backend
    filter:
      - "**/*"
      - ".*"               # ✅ CRITICAL: Include .env (dotfile)
      - "!*.log"
      - "!*.db"            # ✅ No .db files exist, but keep as safety
      - "!*.db-shm"
      - "!*.db-wal"
      - "!*.env.example"
      - "!.git"
      - "!.gitignore"
  - from: frontend/dist
    to: frontend/dist

asar: true
asarUnpack:
  - "backend/node_modules/**/*.node"

# ✅ Only rebuild if you have native modules (bcrypt, not bcryptjs)
# Run: cd backend && npm ls | grep -E "bcrypt|sqlite3|canvas|sharp"
# If results show ONLY bcryptjs (pure JS), keep false
# If results show bcrypt (native), set to true
npmRebuild: false

# ─── Windows ──────────────────────────────────────────────────────────────────
win:
  target:
    - nsis
    - portable
  icon: build/icon.ico
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  shortcutName: PharmacyPOS

# ─── Linux ────────────────────────────────────────────────────────────────────
linux:
  target:
    - deb
    - AppImage
  category: Utility
  icon: build/icons
  maintainer: Emmanuel Appiah <emk.appiah@gmail.com>
  artifactName: ${productName}-${version}-${arch}.${ext}
  desktop:
    Name: PharmacyPOS
    Comment: Pharmacy Point of Sale System
    Categories: Office;Business;Utility
    StartupNotify: true
    Terminal: false
    Type: Application

deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libcups2
  compression: xz
  priority: optional

# ─── Mac ──────────────────────────────────────────────────────────────────────
mac:
  target:
    - dmg
    - zip
  category: public.app-category.business
  icon: build/icon.icns

publish: null